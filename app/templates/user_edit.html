{% extends 'base.html' %}{% block title %}Edit user{% endblock %}{% block page_heading %}Edit user account{% endblock %}{% block content %}
<div class="page-intro"><div><div class="eyebrow">ACCESS CONTROL</div><h1>Edit {{ item.full_name }}</h1><p>Update role, group access or reset the account password.</p></div><a class="button button-ghost" href="{{ url_for('main.users') }}">← Back to users</a></div>
<section class="panel form-panel narrow-panel"><form method="post" class="stack-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Username<input value="{{ item.username }}" disabled></label><label>Full name<input name="full_name" value="{{ item.full_name }}" required></label><label>Role<select name="role"><option value="GROUP_USER" {% if item.role=='GROUP_USER' %}selected{% endif %}>GROUP_USER</option><option value="ADMIN" {% if item.role=='ADMIN' %}selected{% endif %}>ADMIN</option></select></label><label>Assigned group<select name="group_id"><option value="">None (admin)</option>{% for g in groups %}<option value="{{ g.group_id }}" {% if item.group_id==g.group_id %}selected{% endif %}>{{ g.group_name }}</option>{% endfor %}</select></label><label class="check-line"><input type="checkbox" name="can_submit_emergency" {% if item.can_submit_emergency %}checked{% endif %}> Authorise emergency submissions</label><label>Reset password (optional)<input type="password" name="new_password" minlength="10" placeholder="Leave blank to keep existing password"><small>Minimum 10 characters. The user must receive the new password securely.</small></label><div class="form-actions"><a class="button button-ghost" href="{{ url_for('main.users') }}">Cancel</a><button class="button button-primary">Save account</button></div></form></section>
{% endblock %}
