{% extends 'base.html' %}{% block title %}Edit group{% endblock %}{% block page_heading %}Edit group{% endblock %}{% block content %}
<div class="page-intro"><div><div class="eyebrow">REFERENCE DATA</div><h1>Edit {{ item.group_name }}</h1><p>Group code is immutable so existing requests and audit history remain linked.</p></div><a class="button button-ghost" href="{{ url_for('main.groups') }}">← Back to groups</a></div>
<section class="panel form-panel narrow-panel"><form method="post" class="stack-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Group ID<input value="{{ item.group_id }}" disabled></label><label>Group name<input name="group_name" value="{{ item.group_name }}" required></label><label>Category<select name="category">{% for c in ['SECURITY','MEDICAL','EVENTS','MAINTENANCE'] %}<option value="{{ c }}" {% if item.category==c %}selected{% endif %}>{{ c }}</option>{% endfor %}</select><small>Priority rank is recalculated automatically.</small></label><label>Contact name<input name="contact_name" value="{{ item.contact_name }}"></label><label>Contact mobile<input name="contact_mobile" maxlength="10" value="{{ item.contact_mobile }}"></label><div class="form-actions"><a class="button button-ghost" href="{{ url_for('main.groups') }}">Cancel</a><button class="button button-primary">Save group</button></div></form></section>
{% endblock %}
